services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + MongoDB Atlas)
  # -------------------------------------------------------------
  - type: web
    name: finrecon-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MATCH_CONFIDENCE_THRESHOLD
        value: "0.90"
      - key: LIKELY_MATCH_THRESHOLD
        value: "0.70"
      - key: SETTLEMENT_SLA_HOURS
        value: "2"

  # -------------------------------------------------------------
  # 2. Frontend Web Service (Vite + React Single Page App)
  # -------------------------------------------------------------
  - type: web
    name: finrecon-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
