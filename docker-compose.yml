services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finrecon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["finrecon-data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finrecon
    ports: ["4000:4000"]
    depends_on: [postgres]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  finrecon-data:
